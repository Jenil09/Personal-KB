[project]
name = "redshift7-workspace"
version = "0.0.0"
description = "Redshift7 personal services monorepo"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv.workspace]
members = ["apps/*", "libs/*", "tools/*"]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "ruff>=0.14.0",
    "mypy>=1.18.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "testcontainers>=4.13.0",
    # `test_compose_prod.py` reads compose.prod.yml structurally, which is how
    # AD-023's no-host-port rule is checked in CI. PyYAML arrives transitively
    # with `uvicorn[standard]`, but a test dependency that holds only as long as
    # an unrelated extra keeps shipping it is one that breaks confusingly.
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    # Both provider extras, so the contract suite can run against both drivers.
    # Extras on a workspace member are not installed by `uv sync` otherwise.
    "ai-embeddings[gemini,openai]",
]

[tool.uv.sources]
ai-embeddings = { workspace = true }

# ---------------------------------------------------------------------------
# Shared tool configuration. Workspace members inherit this; they should not
# redefine it unless a member genuinely needs to differ.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["apps", "libs", "tools"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes
    "T20",       # print statements
    "SIM",       # simplify
    "PTH",       # pathlib over os.path
    "RUF",
]
ignore = [
    "E501",      # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
# Operator entry points, run from `just` and from CI. Their output goes to a
# terminal, so `print` is the interface rather than a stray debug statement.
"**/scripts/**" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["kb_api", "kb_cli", "kb_client", "platform_core", "platform_fastapi", "platform_db", "ai_embeddings"]

[tool.mypy]
python_version = "3.13"
# Without the plugin, `dataclass_transform` makes mypy demand every settings
# field as a constructor argument, even though the environment supplies them.
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_reexport = true
pretty = true
show_error_codes = true

# Test suites are checked with `no-untyped-def` off — see the justfile. A
# per-module override cannot express it: `tests/` deliberately has no
# `__init__.py`, so mypy sees bare module names like `test_health`, and its
# override patterns only wildcard whole components.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps", "libs", "tools"]
python_files = ["test_*.py"]
# importlib import mode: every member has its own `tests/` directory, so test
# modules collide on basename (two `test_settings.py`) under the default
# prepend mode. This also keeps `tests/` off sys.path.
addopts = "--strict-markers --strict-config --import-mode=importlib"
markers = [
    "integration: requires containerised Postgres and Chroma (deselect with -m 'not integration')",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

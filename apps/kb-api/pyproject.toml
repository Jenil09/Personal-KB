[project]
name = "kb-api"
version = "0.1.0"
description = "Personal Knowledge Base API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ai-embeddings",
    "platform-core",
    "platform-db",
    "platform-fastapi",
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.38.0",
    # The thin HTTP client, not the `chromadb` server distribution: this service
    # talks to a Chroma container over the network and has no use for onnxruntime,
    # tokenizers, or the embedded server the full package drags in (AD-010).
    "chromadb-client>=1.5.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kb_api"
module-root = "src"

[tool.uv.sources]
ai-embeddings = { workspace = true }
platform-core = { workspace = true }
platform-db = { workspace = true }
platform-fastapi = { workspace = true }

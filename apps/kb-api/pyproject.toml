[project]
name = "kb-api"
version = "0.1.0"
description = "Personal Knowledge Base API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "platform-core",
    "platform-db",
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.38.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kb_api"
module-root = "src"

[tool.uv.sources]
platform-core = { workspace = true }
platform-db = { workspace = true }

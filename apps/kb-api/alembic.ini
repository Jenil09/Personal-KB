# Alembic configuration for kb-api.
#
# There is no `sqlalchemy.url` here on purpose. The DSN is a secret and comes
# from the environment through `kb_api.config`, which `migrations/env.py` reads.
# A URL in this file is a URL in git.
#
# Run through `just migrate`, which loads the root `.env` before invoking
# alembic; running it by hand from this directory needs the environment set.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# Revision files sort by creation date, so `ls versions/` is history in order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

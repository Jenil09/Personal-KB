name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  UV_FROZEN: "1"

jobs:
  quality:
    name: lint / types / unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Lockfile is current
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      # Through `just`, not a copy of the command. The copy that used to live
      # here was `mypy apps libs`, which fails outright on `Duplicate module
      # named "conftest"` — two members having a `tests/conftest.py` is normal,
      # and the recipe checks each suite in its own pass for exactly that
      # reason. `uvx` rather than a setup action, since uv is already here.
      - name: Types
        run: uvx --from rust-just just typecheck

      # AD-016: the committed schema is the contract. A route change that was
      # never exported fails here rather than breaking an n8n workflow on the
      # next deploy.
      - name: OpenAPI schema is current
        run: uv run python -m kb_api.scripts.export_openapi --check

      - name: Unit tests
        run: uv run pytest -m "not integration" --cov --cov-report=term-missing

  # The deployable artefact, built on every PR. A Containerfile that only ever
  # gets built at deploy time is one whose breakage is discovered at deploy time
  # — and this one has a failure mode the test suite cannot see, because the dev
  # dependency group installs both `ai-embeddings` driver extras while the image
  # installs only what `kb-api` declares.
  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker build -f apps/kb-api/Containerfile -t kb-api:ci .

      # Imports the composition root under the runtime's own dependency set, so
      # a driver missing from the image fails here rather than at startup on the
      # VPS. It reads no environment: `build_app` is a factory precisely so the
      # module is importable without a full configuration (Phase 6).
      - name: The image can import the app it serves
        run: docker run --rm kb-api:ci python -c "import kb_api.main; print(kb_api.main.build_app)"

      - name: Alembic resolves its migrations inside the image
        run: docker run --rm --workdir /app/apps/kb-api kb-api:ci alembic heads

      # AD-023: the absence of a `ports:` key is the control, so it is checked
      # rather than reviewed. `apps/kb-api/tests/test_compose_prod.py` asserts
      # the same thing structurally in the unit suite; this is the greppable
      # half, and it costs nothing to have both.
      - name: compose.prod.yml publishes no host port
        run: |
          if grep -nE '^\s*ports:' compose.prod.yml; then
            echo "::error file=compose.prod.yml::AD-023 forbids a ports: key in this file"
            exit 1
          fi
          echo "no ports: key in compose.prod.yml"

  # Same lesson as the kb-api image job: a Containerfile that only ever gets
  # built at deploy time is one whose breakage is discovered at deploy time.
  # kb-mcp has no driver extras, but it does have an entry point that must
  # resolve inside the image (`python -m kb_mcp`) and an `httpx2` TLS path
  # that uses the OS trust store rather than certifi.
  image-mcp:
    name: image-mcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker build -f apps/kb-mcp/Containerfile -t kb-mcp:ci .

      - name: The image can import the app it serves
        run: docker run --rm kb-mcp:ci python -c "import kb_mcp.main; print(kb_mcp.main.build_app)"

      # No secrets: `__main__` turns a missing configuration into exit 2 and
      # the variable name. That is the Phase 9 shebang check — the interpreter
      # the CMD actually invokes exists — and the fail-fast check in one.
      - name: The entry point fail-fasts on a missing secret
        run: |
          set +e
          docker run --rm kb-mcp:ci python -m kb_mcp > /tmp/kb-mcp.out 2> /tmp/kb-mcp.err
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "::error::expected python -m kb_mcp to exit 2, got $status"
            cat /tmp/kb-mcp.out
            cat /tmp/kb-mcp.err
            exit 1
          fi
          if ! grep -q 'KB_MCP__API_KEYS' /tmp/kb-mcp.err; then
            echo "::error::stderr did not name KB_MCP__API_KEYS"
            cat /tmp/kb-mcp.err
            exit 1
          fi

      # 4.8: httpx2 validates against the OS trust store. A slim image missing
      # ca-certificates fails here, not after a deploy. Do not "fix" a failure
      # by pointing at certifi.
      - name: httpx2 trusts the OS store
        run: >
          docker run --rm kb-mcp:ci python -c
          "import httpx2, ssl; print(ssl.get_default_verify_paths());
          r = httpx2.get('https://pypi.org/simple/pip/', timeout=15);
          assert r.status_code == 200, r.status_code"

  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: kb_local_dev
          POSTGRES_DB: kb
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U kb -d kb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      chroma:
        image: chromadb/chroma:latest
        ports: ["8001:8000"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Integration tests
        env:
          KB_API__POSTGRES__DSN: postgresql+asyncpg://kb:kb_local_dev@localhost:5433/kb
          KB_API__CHROMA__HOST: localhost
          KB_API__CHROMA__PORT: "8001"
        run: uv run pytest -m integration

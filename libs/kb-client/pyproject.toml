[project]
name = "kb-client"
version = "0.1.0"
description = "The kb-api /v1 wire contract and its HTTP client, shared by every consumer"
requires-python = ">=3.13,<3.14"
dependencies = [
    # `platform-core` for the error hierarchy and the settings base, and nothing
    # else from the workspace. Every consumer of this package is an HTTP client
    # of a deployed service (AD-025): depending on `kb-api` would let the wire
    # contract drift into the service's internals and stop being a contract.
    "platform-core",
    "httpx>=0.28.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kb_client"
module-root = "src"

[tool.uv.sources]
platform-core = { workspace = true }

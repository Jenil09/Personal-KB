[project]
name = "platform-db"
version = "0.1.0"
description = "Async SQLAlchemy engine, Alembic scaffolding, and the two-tier audit trail for Redshift7 services"
requires-python = ">=3.13,<3.14"
dependencies = [
    "platform-core",
    "sqlalchemy[asyncio]>=2.0.44",
    "asyncpg>=0.31.0",
    "alembic>=1.18.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "platform_db"
module-root = "src"

[tool.uv.sources]
platform-core = { workspace = true }

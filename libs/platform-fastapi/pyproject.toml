[project]
name = "platform-fastapi"
version = "0.1.0"
description = "App factory, auth, problem+json errors, and health checks for Redshift7 services"
requires-python = ">=3.13,<3.14"
dependencies = [
    "platform-core",
    # AD-018: `AuditRecord` and the tier-1 writer are shared vocabulary, so the
    # audit middleware imports them rather than restating the row's shape at
    # this boundary — restating it is how the writer, the spill format, and the
    # columns drift apart, which is the thing AD-018 exists to prevent.
    "platform-db",
    "fastapi>=0.121.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "platform_fastapi"
module-root = "src"

[tool.uv.sources]
platform-core = { workspace = true }
platform-db = { workspace = true }
